# Pipeline 1.1 (servicios base: RabbitMQ, Redis, observabilidad) y 1.2..N (apps).
# Corre cuando termina bien el CI en main (ya hay imagenes nuevas en el registry).
name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/tp3
  TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  base-services:
    if: >-
      vars.GCP_PROJECT != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}
      - uses: google-github-actions/get-gke-credentials@v2
        with: { cluster_name: tp3, location: "${{ vars.GKE_ZONE }}" }
      - uses: azure/setup-helm@v4
      - name: Secrets desde Secret Manager -> Kubernetes Secrets (nunca en el repo)
        run: |
          RABBIT_PASS=$(gcloud secrets versions access latest --secret=tp3-rabbit-pass)
          REDIS_PASS=$(gcloud secrets versions access latest --secret=tp3-redis-pass)
          AUTH_SECRET=$(gcloud secrets versions access latest --secret=tp3-auth-secret)
          echo "::add-mask::$RABBIT_PASS"; echo "::add-mask::$REDIS_PASS"; echo "::add-mask::$AUTH_SECRET"
          RABBIT_ENC=$(python3 -c 'import sys,urllib.parse as u;print(u.quote(sys.argv[1],safe=""))' "$RABBIT_PASS")
          REDIS_ENC=$(python3 -c 'import sys,urllib.parse as u;print(u.quote(sys.argv[1],safe=""))' "$REDIS_PASS")
          echo "::add-mask::$RABBIT_ENC"; echo "::add-mask::$REDIS_ENC"
          kubectl create namespace tp3 --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n tp3 create secret generic rabbitmq-auth --from-literal=rabbitmq-password="$RABBIT_PASS" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n tp3 create secret generic redis-auth --from-literal=redis-password="$REDIS_PASS" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n tp3 create secret generic tp3-secrets \
            --from-literal=RABBIT_URL="amqp://tp3:${RABBIT_ENC}@rabbitmq:5672/" \
            --from-literal=REDIS_URL="redis://:${REDIS_ENC}@redis:6379/0" \
            --from-literal=AUTH_SECRET="$AUTH_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: RabbitMQ y Redis (nodepool infra)
        run: |
          kubectl apply -k TP3/k8s/infra
          kubectl -n tp3 rollout status statefulset/rabbitmq --timeout=600s
          kubectl -n tp3 rollout status statefulset/redis --timeout=300s

  # Job aparte de apps: si la observabilidad falla queda en rojo, pero no frena el deploy de las apps.
  observability:
    needs: base-services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}
      - uses: google-github-actions/get-gke-credentials@v2
        with: { cluster_name: tp3, location: "${{ vars.GKE_ZONE }}" }
      - uses: azure/setup-helm@v4
      - name: Password de Grafana (se genera una sola vez y se lee con kubectl, nunca en el repo)
        run: |
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          if ! kubectl -n monitoring get secret grafana-admin >/dev/null 2>&1; then
            kubectl -n monitoring create secret generic grafana-admin \
              --from-literal=admin-user=admin --from-literal=admin-password="$(openssl rand -base64 18)"
          fi
      - name: kube-prometheus-stack, ServiceMonitors, alertas y dashboard (Hit #4)
        run: |
          sed "s/PROJECT/${{ vars.GCP_PROJECT }}/g" TP3/observability/kube-prometheus-stack-values.yaml > "$RUNNER_TEMP/values.yaml"
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack --version 92.16.1 \
            -n monitoring --create-namespace -f "$RUNNER_TEMP/values.yaml" \
            --wait --timeout 15m
          kubectl apply -k TP3/observability
      - name: Loki y Fluent Bit (logs centralizados en Grafana)
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add fluent https://fluent.github.io/helm-charts
          helm upgrade --install loki grafana/loki --version 7.5.0 \
            -n monitoring -f TP3/observability/loki/loki-values.yaml --wait --timeout 10m
          helm upgrade --install fluent-bit fluent/fluent-bit --version 0.58.3 \
            -n monitoring -f TP3/observability/loki/fluentbit-values.yaml --wait --timeout 5m
          kubectl apply -f TP3/observability/loki/grafana-datasource.yaml

  apps:
    needs: base-services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: [backend, split, joiner, dlq-monitor, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}
      - uses: google-github-actions/get-gke-credentials@v2
        with: { cluster_name: tp3, location: "${{ vars.GKE_ZONE }}" }
      - name: Deploy ${{ matrix.app }}
        working-directory: TP3/k8s/overlays/gke
        run: |
          for s in backend split joiner dlq-monitor frontend; do
            kustomize edit set image tp3/$s=$REGISTRY/$s:$TAG
          done
          kubectl apply -k .
          kubectl -n tp3 rollout status deploy/${{ matrix.app }} --timeout=300s
