# Pipeline 2 (workers dinamicos): crea/destruye las VMs workers fuera del cluster.
# plan en PR; apply manual (workflow_dispatch) con la cantidad deseada.
# TODO (deseable): job programado que lea la profundidad de tasks.<pool> en /stats
# y calcule worker_count automaticamente.
name: workers
on:
  pull_request:
    paths: ["TP3/infra/terraform/workers/**"]
  workflow_dispatch:
    inputs:
      worker_count:
        description: "Cantidad de VMs workers (0 = teardown)"
        required: true
        default: "2"
      worker_tag:
        description: "Tag de la imagen worker"
        required: true
        default: "latest"

permissions:
  contents: read
  id-token: write

env:
  TF_VAR_project_id: ${{ vars.GCP_PROJECT }}
  TF_VAR_region: ${{ vars.GCP_REGION }}
  TF_VAR_workers_service_account: ${{ vars.WORKERS_SA }}
  TF_VAR_rabbit_host: ${{ vars.RABBIT_INTERNAL_IP }}
  TF_VAR_redis_host: ${{ vars.REDIS_INTERNAL_IP }}
  TF_VAR_worker_count: ${{ inputs.worker_count || '0' }}
  TF_VAR_worker_image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/tp3/worker:${{ inputs.worker_tag || 'latest' }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: TP3/infra/terraform/workers }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform fmt -check
      - run: terraform validate
      - run: terraform plan -input=false -out=tfplan
      - if: github.event_name == 'workflow_dispatch'
        run: terraform apply -input=false tfplan
