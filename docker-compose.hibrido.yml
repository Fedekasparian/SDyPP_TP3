# Hit #2 (hibrido): el stack corre en el equipo local y los workers extra en VMs de
# GCP que llegan por Tailscale. Se suma al compose base:
#   docker compose -f docker-compose.yml -f docker-compose.hibrido.yml up -d --build
# En .env: RABBIT_PASS y REDIS_PASS = los de Secret Manager tp3-hibrido-*, y
#   RABBIT_URL=amqp://tp3:<RABBIT_PASS>@rabbitmq:5672/
#   REDIS_URL=redis://:<REDIS_PASS>@redis:6379/0
# (token_urlsafe: no hace falta codificar nada en las URLs).
services:
  redis:
    # Redis queda alcanzable desde la VM: sin password no se expone.
    command: ["redis-server", "--requirepass", "${REDIS_PASS:?definir REDIS_PASS en .env}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASS\" --no-auth-warning ping | grep -q PONG"]
    environment:
      REDIS_PASS: ${REDIS_PASS}
