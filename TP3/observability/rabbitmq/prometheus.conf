# Hit #4 (D): metricas de RabbitMQ *por objeto* (por cola), no solo los totales globales.
#
# Por defecto el plugin rabbitmq_prometheus solo publica agregados globales
# (rabbitmq_global_messages_*). Con esto activado aparecen ademas las series por cola
# (rabbitmq_queue_messages_ready{queue="..."}, rabbitmq_queue_messages_unacked{...}),
# que son las que necesita el panel "Mensajes de RabbitMQ: publicados / consumidos / en cola"
# y la alerta ColaDeTareasAlta para distinguir tasks.tp3-* de tasks.parked.
#
# Contra: con muchas colas la cardinalidad crece. Con las ~6 colas del TP es irrelevante.
prometheus.return_per_object_metrics = true
