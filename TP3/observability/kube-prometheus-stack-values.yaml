# helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f TP3/observability/kube-prometheus-stack-values.yaml
# Todo en el nodepool `infra`.
x-infra: &infra
  nodeSelector: { pool: infra }
  tolerations: [{ key: pool, operator: Equal, value: infra, effect: NoSchedule }]

prometheusOperator: *infra
kube-state-metrics: *infra
alertmanager:
  alertmanagerSpec: *infra
prometheus:
  # Con Workload Identity el pod no ve el SA del nodo: la KSA de Prometheus se mapea a
  # tp3-gke-nodes (compute.viewer) con el binding de infra/terraform/bootstrap/main.tf.
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: tp3-gke-nodes@PROJECT.iam.gserviceaccount.com
  prometheusSpec:
    <<: *infra
    retention: 3d
    # Levanta ServiceMonitors/PrometheusRules de cualquier namespace sin exigir labels del chart
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # Scrape de las VMs workers (fuera del cluster) por GCE service discovery.
    # deploy.yml reemplaza PROJECT por vars.GCP_PROJECT antes del helm upgrade.
    additionalScrapeConfigs:
      - job_name: tp3-vm-workers
        gce_sd_configs:
          - { project: PROJECT, zone: us-central1-a, port: 8080, filter: 'labels.app = "tp3-worker"' }
          - { project: PROJECT, zone: us-central1-b, port: 8080, filter: 'labels.app = "tp3-worker"' }
          - { project: PROJECT, zone: us-central1-c, port: 8080, filter: 'labels.app = "tp3-worker"' }
        relabel_configs:
          - { source_labels: [__meta_gce_instance_name], target_label: instance }
grafana:
  <<: *infra
  # Contraseña de admin desde un Secret (no en el repo):
  #   kubectl -n monitoring create secret generic grafana-admin --from-literal=admin-user=admin --from-literal=admin-password=...
  admin:
    existingSecret: grafana-admin
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
