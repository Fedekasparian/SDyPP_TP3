# kubectl apply -k TP3/observability   (despues de instalar kube-prometheus-stack)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - servicemonitors.yaml
  - alerts.yaml
configMapGenerator:
  - name: tp3-dashboard
    namespace: monitoring
    files: [dashboards/tp3.json]
    options:
      disableNameSuffixHash: true
      labels: { grafana_dashboard: "1" }
