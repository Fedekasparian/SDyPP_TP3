server {
    listen 8080;
    client_max_body_size 600m;

    location /health {
        default_type application/json;
        return 200 '{"frontend":"ok"}';
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
