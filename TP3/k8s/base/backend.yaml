apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app: backend, tier: apps }
spec:
  replicas: 3  # R4: stateless, cualquier replica atiende cualquier request
  selector: { matchLabels: { app: backend } }
  template:
    metadata:
      labels: { app: backend, tier: apps }
    spec:
      containers:
        - name: backend
          image: tp3/backend
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: tp3-config }
            - secretRef: { name: tp3-secrets }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: { app: backend, metrics: "true" }
spec:
  selector: { app: backend }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: backend }
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
