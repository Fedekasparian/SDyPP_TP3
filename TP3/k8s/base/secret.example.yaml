# EJEMPLO, no se aplica (no esta en kustomization.yaml). El Secret real se crea asi:
#   kubectl -n tp3 create secret generic tp3-secrets \
#     --from-literal=RABBIT_URL='amqp://USER:PASS@rabbitmq:5672/' \
#     --from-literal=REDIS_URL='redis://:PASS@redis-master:6379/0' \
#     --from-literal=AUTH_SECRET="$(openssl rand -base64 32)"
# En CI los valores salen de GitHub Secrets / Secret Manager (ver .github/workflows/deploy.yml).
apiVersion: v1
kind: Secret
metadata:
  name: tp3-secrets
type: Opaque
stringData:
  RABBIT_URL: "<completar>"
  REDIS_URL: "<completar>"
  AUTH_SECRET: "<completar>"
