# RabbitMQ y Redis minimos para el cluster local. En GKE van como StatefulSets
# en el nodepool de infraestructura (ver TP3/k8s/infra/).
# Las credenciales salen del Secret `rabbitmq-auth` (no versionado):
#   kubectl -n tp3 create secret generic rabbitmq-auth --from-literal=rabbitmq-password=...
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, labels: { app: rabbitmq } }
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: tp3 }
            - { name: RABBITMQ_DEFAULT_PASS, valueFrom: { secretKeyRef: { name: rabbitmq-auth, key: rabbitmq-password } } }
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: mgmt, containerPort: 15672 }
            - { name: metrics, containerPort: 15692 }
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            periodSeconds: 15
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, labels: { app: rabbitmq } }
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672 }
    - { name: mgmt, port: 15672 }
    - { name: metrics, port: 15692 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, labels: { app: redis } }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports: [{ name: redis, containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis, labels: { app: redis } }
spec: { selector: { app: redis }, ports: [{ name: redis, port: 6379 }] }
